[tools]
python = "3.12.9"
uv = "latest"


[env]
_.path = ["./.venv", "./.venv/Scripts"]
UV_LINK_MODE="copy"

[tasks.compile]
run = "uv run python -I -m PyInstaller --clean drlua.spec"

[tasks.release]
description = "Compile DrLua and publish the current version to GitHub"
depends = ["compile"]
shell = "pwsh -NoProfile -Command"
run_windows = '''
$version = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
$arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
$asset = "dist/drlua-v$version-windows-$arch.exe"
Copy-Item -LiteralPath "dist/drlua.exe" -Destination $asset
gh release create "v$version" $asset --repo electblake/DrLua --title "DrLua v$version" --notes-file README.md
'''
