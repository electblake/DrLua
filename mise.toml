[tools]
python = "3.12.9"
uv = "latest"


[env]
_.path = ["./.venv", "./.venv/Scripts"]
UV_LINK_MODE="copy"

[tasks.compile]
run = "uv run python -I -m PyInstaller --clean drlua.spec"

[tasks.build-setup]
description = "Build the Tkinter app and Windows installer (pass -FfmpegRoot)"
run = "pwsh -NoProfile -File scripts/build-setup.ps1"

[tasks.release]
description = "Compile DrLua and publish the current version to GitHub"
depends = ["compile"]
run_windows = "pwsh -NoProfile -File scripts/release.ps1"
