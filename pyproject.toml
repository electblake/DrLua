[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drlua"
version = "0.0.1"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "iterfzf>=1.9.0.67.0",
    "loguru>=0.7.3",
    "luadata>=1.0.5",
    "platformdirs>=4.10.0",
    "pyperclip>=1.11.0",
    "ruff>=0.15.16",
    "tqdm>=4.68.1",
    "typer>=0.26.7",
]

[project.scripts]
drlua = "drlua.cli:app"

[tool.setuptools.packages.find]
include = ["drlua*"]
namespaces = true

[tool.setuptools.package-data]
drlua = ["lua/*.lua", "fusion/*.setting"]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "ruff>=0.15.16",
]
