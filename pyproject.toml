[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DrLua"
version = "0.2.2"
description = "DrLua writes lua scripts for Davinci Resolve to automate media imports and timeline creation"
requires-python = ">=3.12"
dependencies = [
    "gooey>=1.0.8.1",
    "iterfzf>=1.9.0.67.0",
    "loguru>=0.7.3",
    "luadata>=1.0.5",
    "platformdirs>=4.10.0",
    "pythonnet>=3.1.0",
    "ruff>=0.15.16",
    "tqdm>=4.68.1",
]

[project.scripts]
drlua = "drlua.cli:main"

[tool.setuptools.packages.find]
include = ["drlua*"]
namespaces = true

[tool.setuptools.package-data]
drlua = ["lua/*.lua", "fusion/*.setting"]

[dependency-groups]
dev = [
    "numpy>=2.5.1",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
