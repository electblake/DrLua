[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drlua"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pyperclip>=1.11.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "tqdm>=4.68.1",
    "typer>=0.26.7",
]

[project.scripts]
drlua = "drlua.cli:app"

[tool.setuptools]
packages = ["drlua"]
