[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DrLua"
version = "0.3.0"
description = "DrLua writes lua scripts for Davinci Resolve to automate media imports and timeline creation"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "luadata>=1.0.5",
    "platformdirs>=4.10.0",
    "ruff>=0.15.16",
]

[project.gui-scripts]
drlua = "drlua.gui:main"

[tool.setuptools.packages.find]
include = ["drlua*"]
namespaces = true

[tool.setuptools.package-data]
drlua = ["lua/*.lua", "fusion/*.setting"]

[dependency-groups]
dev = [
    "numpy>=2.5.1",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
